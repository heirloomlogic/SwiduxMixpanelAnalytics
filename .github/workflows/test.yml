name: Tests

on:
  # Both triggers are deliberate. Running the same job on `pull_request` and
  # `push: main` is normally a flat 2x waste, but this repo allows squash merges
  # only (`allow_merge_commit: false`, `allow_rebase_merge: false`), so the
  # commit that lands on `main` is a new SHA that PR CI never ran against —
  # measured on PR #11, head 355a0cd vs merge commit 26b457d. Drop the push
  # trigger and `main` becomes untested. Revisit only if merge commits are
  # re-enabled.
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test-macos:
    runs-on: macos-26
    # ~2x the observed p90 of 106s, with headroom for a cold SwiftPM cache. The
    # GitHub default is six hours, which a hung `swift test` would hold in full.
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `swift test` resolves and builds mixpanel-swift and Swidux after this
          # step. checkout still defaults this to true in v7.0.1, which would
          # leave GITHUB_TOKEN in .git/config for that third-party code to read.
          persist-credentials: false

      # No Package.resolved is committed (deliberate), so key on the manifest
      # with a fuzzy fallback; SwiftPM's repository cache is content-addressed
      # and refreshes incrementally on a stale hit.
      - name: Cache SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/repositories
            .build/checkouts
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-macos-${{ hashFiles('Package.swift') }}
          restore-keys: |
            swiftpm-macos-

      - name: Test
        run: swift test

  # 1.1.0 advertised mixpanel-swift `from: "6.4.0"` but couldn't actually
  # compile against 6.4.0 exactly — nothing caught it because CI only ever
  # resolves the newest versions that satisfy `from:`, never the floor it
  # promises. This job forces every direct dependency to its declared floor
  # so a repeat of that gap fails CI instead of shipping.
  test-macos-floor:
    runs-on: macos-26
    # Same shape as test-macos; rewriting Package.swift's `from:` to `exact:`
    # is a single sed pass, so the same budget applies.
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `swift test` resolves and builds mixpanel-swift and Swidux after this
          # step. checkout still defaults this to true in v7.0.1, which would
          # leave GITHUB_TOKEN in .git/config for that third-party code to read.
          persist-credentials: false

      # No Package.resolved is committed (deliberate), so key on the manifest
      # with a fuzzy fallback; SwiftPM's repository cache is content-addressed
      # and refreshes incrementally on a stale hit. Distinct prefix from
      # test-macos: this job resolves `exact:` pins to the floor versions, so
      # its checkouts aren't interchangeable with the `from:` job's cache.
      - name: Cache SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/repositories
            .build/checkouts
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-macos-floor-${{ hashFiles('Package.swift') }}
          restore-keys: |
            swiftpm-macos-floor-

      # Rewrite each direct dependency's `from:` to `exact:` so this job
      # builds against the floor the manifest promises, not whatever's newest
      # today; deriving it from the manifest means it tracks floor bumps
      # automatically. Scoped to the main `Package(...)` call (everything
      # before the dev-tooling MARK comment) so the gated dev-tooling
      # dependencies below it — inactive here since `.dev-tooling` is never
      # created in this job — are left untouched.
      - name: Pin dependencies to their declared floor versions
        run: |
          sed -E -i '' '1,/\/\/ MARK: - Dev-only tooling/ s/(\.package\(url: "[^"]+", )from: "([^"]+)"/\1exact: "\2"/' Package.swift
          echo "Dependencies pinned for this job:"
          sed -n '/dependencies: \[/,/\],/p' Package.swift

      - name: Test
        run: swift test

  test-ios:
    runs-on: macos-26
    # ~2x the observed p90 of 127s, with extra headroom because simulator boot
    # time is the most variable part of this job.
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # xcodebuild resolves and builds third-party packages after this step.
          persist-credentials: false

      - name: Cache SwiftPM (Xcode)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .spm-packages
          key: swiftpm-ios-${{ hashFiles('Package.swift') }}
          restore-keys: |
            swiftpm-ios-

      - name: Test (iOS Simulator)
        run: |
          # A name-based `grep -oE 'iPhone [0-9]+( Pro)?( Max)?'` (the previous
          # approach) never matches "iPhone Air" and truncates "iPhone 16e"
          # down to "iPhone 16" — silently picking a stale or wrong simulator.
          # Select by UDID instead: parse simctl's own JSON (jq ships on
          # GitHub's macOS runners), and pick an available iPhone from the
          # newest iOS runtime that has one and that the selected Xcode's SDK
          # can target — runner images also carry beta runtimes newer than it.
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          UDID="$(xcrun simctl list devices available --json | jq -r --arg sdk "$SDK" '
            ($sdk | split(".") | map(tonumber) | .[0:2]) as $max
            | .devices
            | to_entries
            | map(select(.key | test("^com\\.apple\\.CoreSimulator\\.SimRuntime\\.iOS-[0-9]+-[0-9]+$")))
            | map({ver: (.key | capture("iOS-(?<maj>[0-9]+)-(?<min>[0-9]+)$") | [(.maj|tonumber), (.min|tonumber)]), devices: .value})
            | map(select(.ver <= $max))
            | map(.devices |= map(select((.name | test("^iPhone")) and .isAvailable)))
            | map(select(.devices | length > 0))
            | sort_by(.ver)
            | reverse
            | .[0].devices[0].udid // ""
          ')"

          if [ -z "$UDID" ]; then
            echo "::error::No available iPhone simulator in any iOS runtime up to SDK $SDK" >&2
            exit 1
          fi
          echo "Selected simulator UDID: $UDID"

          xcodebuild test -scheme SwiduxMixpanelAnalytics \
            -destination "platform=iOS Simulator,id=$UDID" \
            -clonedSourcePackagesDirPath .spm-packages \
            -skipPackagePluginValidation \
            -skipMacroValidation
