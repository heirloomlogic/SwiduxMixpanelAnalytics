name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  swift-format-lint:
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Persnicket's ci-lint-setup is *executed* in fork-PR context, so it is
      # checked out at an exact commit instead of trusting SwiftPM's `from:`
      # resolution at CI time. To adopt a new Persnicket release, update `ref`
      # to the new tag's commit SHA:
      #   gh api repos/HeirloomLogic/Persnicket/git/ref/tags/<tag> --jq .object.sha
      - name: Checkout Persnicket (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: HeirloomLogic/Persnicket
          ref: 06bda7e73c3e4d1358f1e612225716bfaf17cca6 # 2.2.0
          path: .persnicket-ci

      - name: Setup swift-format lint
        run: .persnicket-ci/bin/ci-lint-setup

      - name: Lint (strict)
        run: xcrun swift-format lint --strict --parallel --recursive --configuration .swift-format Sources Tests
